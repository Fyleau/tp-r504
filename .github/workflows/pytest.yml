name: tests unitaires

on: [push]

jobs:
  test1:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.10"]
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Afficher version Python
        run: python --version

      - name: Afficher nom de la branche
        run: echo "Branche - ${{ github.ref }}"

      - name: Afficher OS runner
        run: echo "OS - ${{ runner.os }}"

      - name: Run tests
        run: pytest TP1/test.py